<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-label="Invisible Middle Intelligence Layer architecture map">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#05070d"/><stop offset="55%" stop-color="#111827"/><stop offset="100%" stop-color="#071411"/></linearGradient>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#d8fff2"/><stop offset="24%" stop-color="#b9dcff"/><stop offset="50%" stop-color="#e0c7ff"/><stop offset="76%" stop-color="#c1ffe4"/><stop offset="100%" stop-color="#fff2c2"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.title{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:850;font-size:46px;fill:#f7fffb}.sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:21px;fill:#bcd7cf}.boxTitle{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;font-weight:800;fill:#f7fffb}.boxText{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;fill:#cfe3dc}.small{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;fill:#94aaa3}</style>
  </defs>
  <rect width="1600" height="760" rx="34" fill="url(#bg)"/>
  <path d="M72 640 C340 460, 440 690, 720 486 S1120 316, 1510 438" fill="none" stroke="url(#holo)" stroke-width="2.4" opacity=".62" filter="url(#glow)"/>
  <text x="70" y="82" class="title">Invisible Middle Intelligence Layer</text>
  <text x="72" y="122" class="sub">From visible signal to structural interpretation, hidden compensation, and flourishing restoration.</text>

  <g transform="translate(70 180)">
    <rect width="275" height="130" rx="22" fill="#0b1318" stroke="url(#holo)" opacity=".96"/>
    <text x="24" y="38" class="boxTitle">Signal Intake</text>
    <text x="24" y="70" class="boxText">Behavioural • Workflow</text>
    <text x="24" y="96" class="boxText">Communication • AI • Governance</text>
  </g>
  <g transform="translate(375 180)">
    <rect width="275" height="130" rx="22" fill="#0b1318" stroke="url(#holo)" opacity=".96"/>
    <text x="24" y="38" class="boxTitle">Contextual Interpretation</text>
    <text x="24" y="70" class="boxText">Trust • Closure • Ownership</text>
    <text x="24" y="96" class="boxText">Thresholds • Predictability</text>
  </g>
  <g transform="translate(680 180)">
    <rect width="275" height="130" rx="22" fill="#0b1318" stroke="url(#holo)" opacity=".96"/>
    <text x="24" y="38" class="boxTitle">Structural Inference</text>
    <text x="24" y="70" class="boxText">What condition is forming?</text>
    <text x="24" y="96" class="boxText">What is system-held?</text>
  </g>
  <g transform="translate(985 180)">
    <rect width="275" height="130" rx="22" fill="#0b1318" stroke="url(#holo)" opacity=".96"/>
    <text x="24" y="38" class="boxTitle">Compensation Map</text>
    <text x="24" y="70" class="boxText">Who carries the hidden work?</text>
    <text x="24" y="96" class="boxText">Where did burden move?</text>
  </g>
  <g transform="translate(1290 180)">
    <rect width="275" height="130" rx="22" fill="#0b1318" stroke="url(#holo)" opacity=".96"/>
    <text x="24" y="38" class="boxTitle">Flourishing Assessment</text>
    <text x="24" y="70" class="boxText">Agency • Trust • Continuity</text>
    <text x="24" y="96" class="boxText">Participation • Recovery</text>
  </g>
  <g stroke="url(#holo)" stroke-width="2" opacity=".72" filter="url(#glow)"><path d="M345 245 H375"/><path d="M650 245 H680"/><path d="M955 245 H985"/><path d="M1260 245 H1290"/></g>

  <g transform="translate(160 430)">
    <rect width="370" height="130" rx="22" fill="#0c1714" stroke="url(#holo)" opacity=".96"/>
    <text x="24" y="40" class="boxTitle">Evidence Surface</text>
    <text x="24" y="74" class="boxText">Strength • Confidence • Pattern</text>
    <text x="24" y="100" class="boxText">Temporal and cross-domain support</text>
  </g>
  <g transform="translate(615 430)">
    <rect width="370" height="130" rx="22" fill="#0c1714" stroke="url(#holo)" opacity=".96"/>
    <text x="24" y="40" class="boxTitle">Dashboard + Report</text>
    <text x="24" y="74" class="boxText">Visibility surface, not the layer</text>
    <text x="24" y="100" class="boxText">Buyer-readable interpretation</text>
  </g>
  <g transform="translate(1070 430)">
    <rect width="370" height="130" rx="22" fill="#0c1714" stroke="url(#holo)" opacity=".96"/>
    <text x="24" y="40" class="boxTitle">Rebalance Guidance</text>
    <text x="24" y="74" class="boxText">Structural restoration</text>
    <text x="24" y="100" class="boxText">Not behavioural suppression</text>
  </g>
  <g stroke="url(#holo)" stroke-width="2" opacity=".72" filter="url(#glow)"><path d="M530 495 H615"/><path d="M985 495 H1070"/></g>

  <text x="74" y="670" class="small">Boundary: public diagnostic intelligence layer only. No protected substrate math, scoring law, kernelization, or live enforcement substrate exposed.</text>
  <text x="74" y="704" class="small">Core question: Where is the system asking humans to compensate for missing structure?</text>
</svg>