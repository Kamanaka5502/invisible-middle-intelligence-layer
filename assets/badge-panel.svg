<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Invisible Middle Intelligence Layer badge panel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="45%" stop-color="#101522"/>
      <stop offset="100%" stop-color="#06110f"/>
    </linearGradient>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d8fff2"/>
      <stop offset="25%" stop-color="#b7d7ff"/>
      <stop offset="50%" stop-color="#dec4ff"/>
      <stop offset="75%" stop-color="#c1ffe4"/>
      <stop offset="100%" stop-color="#fff3c4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:800;font-size:42px;fill:#f7fffC;letter-spacing:.4px}
      .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:20px;fill:#cfe8df;letter-spacing:.2px}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:15px;fill:#eaf8f2;font-weight:700}
      .tiny{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;fill:#9fb7ae}
    </style>
  </defs>
  <rect width="1200" height="260" rx="32" fill="url(#bg)"/>
  <path d="M40 202 C210 120, 350 245, 525 142 S870 72, 1160 155" fill="none" stroke="url(#holo)" stroke-width="2.5" opacity=".75" filter="url(#glow)"/>
  <path d="M56 66 C240 18, 350 125, 530 80 S900 40, 1130 92" fill="none" stroke="url(#holo)" stroke-width="1.4" opacity=".45"/>
  <circle cx="1055" cy="70" r="58" fill="none" stroke="url(#holo)" stroke-width="2" opacity=".55" filter="url(#glow)"/>
  <circle cx="1088" cy="98" r="28" fill="none" stroke="url(#holo)" stroke-width="1.2" opacity=".45"/>
  <text x="60" y="82" class="title">Invisible Middle Intelligence Layer</text>
  <text x="62" y="121" class="sub">Structural systems intelligence for hidden human compensation and flourishing restoration.</text>
  <g transform="translate(60 160)">
    <rect x="0" y="0" width="188" height="38" rx="19" fill="#0e1a19" stroke="url(#holo)" opacity=".95"/>
    <text x="21" y="25" class="small">Architecture Intelligence</text>
    <rect x="210" y="0" width="174" height="38" rx="19" fill="#0e1a19" stroke="url(#holo)" opacity=".95"/>
    <text x="232" y="25" class="small">NDPP Rooted</text>
    <rect x="405" y="0" width="190" height="38" rx="19" fill="#0e1a19" stroke="url(#holo)" opacity=".95"/>
    <text x="427" y="25" class="small">No Deficit Lens</text>
    <rect x="615" y="0" width="204" height="38" rx="19" fill="#0e1a19" stroke="url(#holo)" opacity=".95"/>
    <text x="637" y="25" class="small">Elyria Systems / VA</text>
  </g>
  <text x="62" y="228" class="tiny">Where is the system asking humans to compensate for missing structure?</text>
</svg>
